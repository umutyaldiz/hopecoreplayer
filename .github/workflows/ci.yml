name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @hopeplayer/core
        run: npm run build:core

      - name: Size budget (@hopeplayer/core)
        run: npm run size --workspace=packages/core

      - name: Build @hopeplayer/react
        run: npm run build:react

      - name: Build @hopeplayer/vue
        run: npm run build:vue

      - name: Build @hopeplayer/react-native
        run: npm run build:react-native

      - name: Typecheck all workspaces
        run: npm run typecheck

  e2e:
    # Playwright uçtan uca testleri (apps/playground/test, packages/react-native/test). Dış servisler (IMA, Prebid,
    # GPT, Cast SDK) testlerde sahte — ağa bağımlı değil.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build packages
        run: |
          npm run build:core
          npm run build:react
          npm run build:vue
          npm run build:react-native

      - name: Start playground
        run: |
          npm run dev --workspace=apps/playground -- --port 5183 --strictPort > playground.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5183/ && exit 0; sleep 1; done
          echo "playground did not start"; cat playground.log; exit 1

      - name: Run end-to-end tests
        run: npm test
        env:
          HOPE_TEST_PORT: '5183'

      - name: Upload playground log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playground-log
          path: playground.log