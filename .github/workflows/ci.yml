name: CI

# Yalnızca belge / örnek değişikliklerinde (README, CHANGELOG, docs/, examples/) çalışmaz.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'examples/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'examples/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']

# Aynı dala art arda push'ta önceki (yarım kalan) çalışma iptal edilir — yalnızca son commit test edilir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @hopeplayer/core
        run: npm run build:core

      - name: Size budget (@hopeplayer/core)
        run: npm run size --workspace=packages/core

      - name: Every declared hp:* event is dispatched
        run: npm run check-events --workspace=packages/core

      - name: Build @hopeplayer/react
        run: npm run build:react

      - name: Build @hopeplayer/vue
        run: npm run build:vue

      - name: Build @hopeplayer/react-native
        run: npm run build:react-native

      - name: Typecheck all workspaces
        run: npm run typecheck

  e2e:
    # Chromium uçtan uca testleri 4 paralel parçada (süreye göre dengeli). Firefox + WebKit: cross-browser.yml
    # (gece, elle ve sürüm öncesi). Dış servisler (IMA, Prebid, GPT, Cast SDK) testlerde sahte — ağa bağımlı değil.
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Takımları run.mjs süre ağırlıklarına göre kendisi dağıtır; yeni bir takım otomatik olarak bir parçaya düşer.
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: bash .github/scripts/install-playwright.sh chromium

      - name: Build packages
        run: |
          npm run build:core
          npm run build:react-native
          # vue-wrapper.e2e: playground'daki Vue sayfası @hopeplayer/vue'yu dist'ten yükler.
          npm run build:vue

      - name: Start playground
        run: |
          npm run dev --workspace=apps/playground -- --port 5183 --strictPort > playground.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5183/ && exit 0; sleep 1; done
          echo "playground did not start"; cat playground.log; exit 1

      - name: Run end-to-end tests (shard ${{ matrix.shard }})
        run: node apps/playground/test/run.mjs --shard ${{ matrix.shard }}
        env:
          HOPE_TEST_PORT: '5183'

      - name: Upload playground log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playground-log-${{ strategy.job-index }}
          path: playground.log
