# Kimlik doğrulama OIDC ile yapılır: NODE_AUTH_TOKEN / NPM_TOKEN yok.
#
# npm'in "Trusted Publishing" (OIDC) özelliğini kullanır — bu repo'nun bu
# workflow'u, @hopeplayer/core, @hopeplayer/react ve @hopeplayer/vue için
# npmjs.com tarafında "Trusted Publisher" olarak tanımlanmış OLMALI
# (npmjs.com → paket → Settings → Trusted Publishers → GitHub Actions →
# bu repo + "publish.yml"). O tanım yapılmadan bu workflow npm publish'te
# 404/403 ile başarısız olur.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build @hopeplayer/core
        run: npm run build:core

      - name: Build @hopeplayer/react
        run: npm run build:react

      - name: Build @hopeplayer/vue
        run: npm run build:vue

      - name: Build @hopeplayer/react-native
        run: npm run build:react-native

      - name: Publish @hopeplayer/core
        working-directory: packages/core
        run: npm publish --provenance --access public

      - name: Publish @hopeplayer/react
        working-directory: packages/react
        run: npm publish --provenance --access public

      - name: Publish @hopeplayer/vue
        working-directory: packages/vue
        run: npm publish --provenance --access public

      - name: Publish @hopeplayer/react-native
        working-directory: packages/react-native
        run: npm publish --provenance --access public
