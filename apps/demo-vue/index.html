<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>HopeCorePlayer — Vue demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 4px; }
    p.sub { color: #a3a3a3; margin-top: 0; }
    section { margin-top: 40px; }
    .label { font-size: 14px; color: #a3a3a3; margin-bottom: 8px; display: block; }
    button, select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      color: #fff;
      padding: 6px 14px;
      cursor: pointer;
      margin-right: 8px;
      font: inherit;
    }
    pre {
      background: #111;
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 12px;
      min-height: 48px;
      font-size: 13px;
      color: #d4d4d4;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
